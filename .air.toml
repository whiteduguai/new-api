root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ."
  entrypoint = ["./tmp/main.exe"]
  include_ext = ["go"]
  exclude_dir = ["web", "electron", "docs", "plugins", "assets", "bin", "logs", "tmp", ".git"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
